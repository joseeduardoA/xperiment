
name: Compilar APK de Flet

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.85.3" flet-geolocator

      - name: Mostrar versión de Flet
        run: |
          python -c "import flet; print(flet.__version__)"
          flet --help

      - name: Compilar APK
        run: |
          flet build apk --verbose

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-flet-apk
          path: build/apk/*.apk
          if-no-files-found: error
